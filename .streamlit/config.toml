# One light theme. No [theme.dark] section on purpose: with both variants defined
# Streamlit follows the visitor's OS, and the product is designed for a light page.
[theme]
base = "light"
primaryColor = "#0b66c3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#31333f"
borderColor = "#e3e7ee"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = false

[client]
toolbarMode = "minimal"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
